name: jq 1.7 differential tests

on:
  push:
    branches: [v3-dev, "v3/**"]
  pull_request:
    branches: [v3-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5"

      - name: Install jq from Ubuntu 24.04
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Require jq 1.7
        run: jq --version | grep -E '^jq-1\.7(\.[0-9]+)?$'

      - name: Compare JQ::Lite with jq 1.7
        env:
          JQ_DIFFERENTIAL: "1"
        run: sh ci/fail-on-test-stderr.sh prove -lv t/jq_differential.t
