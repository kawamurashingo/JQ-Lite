name: Fix PR 617 release files

on:
  push:
    branches:
      - fix/iterator-suffix

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iterator-suffix
          fetch-depth: 0

      - name: Restore release files and apply only intended changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          git show origin/main:lib/JQ/Lite.pm > lib/JQ/Lite.pm
          perl -0pi -e "s/our \$VERSION = '2\.51';/our \$VERSION = '2.52';/" lib/JQ/Lite.pm
          perl -0pi -e 's/Version 2\.51/Version 2.52/' lib/JQ/Lite.pm

          git show origin/main:Changes > /tmp/Changes.base
          cat > /tmp/Changes.prefix <<'EOF'
          2.52  2026-09-13

            - Add jq-compatible iterator suffix syntax for keys[] and to_entries[].
            - Preserve existing dotted path iteration such as .users[] and .values[].
            - Add regression coverage for iterator suffix parsing and dotted paths.
            - Bump module version to 2.52.

          EOF
          cat /tmp/Changes.prefix /tmp/Changes.base > Changes

          rm .github/workflows/fix-pr617-release-files.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Changes lib/JQ/Lite.pm .github/workflows/fix-pr617-release-files.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'Clean release file diff for 2.52 [skip ci]'
          git push origin HEAD:fix/iterator-suffix
