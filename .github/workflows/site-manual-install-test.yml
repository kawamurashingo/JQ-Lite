name: Public Pages stable CPAN install example regression

on:
  pull_request:
    branches: [gh-pages]
    paths:
      - index-en.html
      - tests/site_manual_cpan_install.t
      - download.sh
      - install.sh
      - tests/site_install_archive_safety.t
      - tests/site_download_security.t
      - .github/workflows/site-manual-install-test.yml
  push:
    branches: [gh-pages]
    paths:
      - index-en.html
      - tests/site_manual_cpan_install.t
      - download.sh
      - install.sh
      - tests/site_install_archive_safety.t
      - tests/site_download_security.t
      - .github/workflows/site-manual-install-test.yml

permissions:
  contents: read

jobs:
  site-docs:
    name: Offline site installer test (Perl ${{ matrix.perl }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        perl: ["5.14", "5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Check HTML shell example and mocked stable/invalid releases
        run: |
          perl tests/site_manual_cpan_install.t
          perl tests/site_download_security.t
          perl tests/site_install_archive_safety.t
