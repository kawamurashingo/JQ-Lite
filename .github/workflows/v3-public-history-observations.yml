name: v3 public history observation snapshot (NOT release approval)

on:
  # Collect only when this opt-in workflow itself is proposed or updated.
  # The source snapshot can also be refreshed via GitHub Actions "Re-run jobs".
  pull_request:
    branches: [v3-dev]
    paths:
      - .github/workflows/v3-public-history-observations.yml
  push:
    branches: [v3-dev]
    paths:
      - .github/workflows/v3-public-history-observations.yml

permissions:
  contents: read

jobs:
  observe:
    name: Capture CPAN and BackPAN observations (no publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out audit tools (read-only)
        uses: actions/checkout@v7

      - name: Capture originals, checksums and comparison
        id: capture
        # A discrepancy or download failure must not suppress evidence upload.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/v3-public-history-observations"
          mkdir -p "$output/originals" "$output/http"
          {
            printf 'PURPOSE=OBSERVATION_ONLY_NOT_RELEASE_APPROVAL\n'
            printf 'OBSERVED_START_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'GITHUB_RUN_URL=https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'CHECKOUT_SHA=%s\n' "$(git rev-parse HEAD)"
            printf 'GITHUB_EVENT=%s\n' "$GITHUB_EVENT_NAME"
            printf 'CPAN_PRIMARY_URL=https://www.cpan.org/authors/id/S/SH/SHINGO/\n'
            printf 'BACKPAN_URL=https://backpan.cpantesters.org/backpan-releases-by-dist-index.txt.gz\n'
            printf 'NOT_A_PAUSE_CHRONOLOGY_OR_COMPLETENESS_ATTESTATION=1\n'
          } > "$output/provenance.txt"

          # TLS-verified mirror fallback applies ONLY to download failures.
          # Once a source is downloaded, preserve it unmodified and treat
          # any parser error or developer-artifact alert as a hard failure.
          cpan_found=0
          for cpan_url in \
            https://www.cpan.org/authors/id/S/SH/SHINGO/ \
            https://mirror.cogentco.com/pub/cpan/authors/id/S/SH/SHINGO/ \
            https://ftp.jaist.ac.jp/pub/CPAN/authors/id/S/SH/SHINGO/; do
            printf 'CPAN_ATTEMPT=%s\n' "$cpan_url" >> "$output/provenance.txt"
            if curl --fail --location --silent --show-error --retry 1 \
              --connect-timeout 15 --max-time 120 \
              -D "$output/http/cpan-headers.txt" \
              -o "$output/originals/cpan-shingo-index.html" "$cpan_url"; then
              printf 'CPAN_SELECTED_URL=%s\n' "$cpan_url" >> "$output/provenance.txt"
              cpan_found=1
              break
            fi
          done
          if [ "$cpan_found" -ne 1 ]; then
            printf 'AUDIT_STATUS=BLOCKED_CPAN_SOURCE_UNAVAILABLE\n' >> "$output/provenance.txt"
            echo '::warning title=Public-history audit incomplete::No verified HTTPS CPAN mirror available. No release attestation.'
            exit 0
          fi
          # Hash the selected original before parsing. No fallback is
          # permitted after a successful download, even if parsing fails.
          (cd "$output" && sha256sum originals/cpan-shingo-index.html > SHA256SUMS)
          perl ci/inventory-cpan-jq-lite-index.pl \
            --input "$output/originals/cpan-shingo-index.html" \
            > "$output/cpan-observed.tsv"
          printf 'CPAN_FETCH_END_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$output/provenance.txt"
          # Preserve verified CPAN evidence even if BackPAN TLS fails.
          printf 'CPAN_OBSERVED_COUNT=%s\n' "$(tail -n +2 "$output/cpan-observed.tsv" | wc -l | tr -d ' ')" >> "$output/provenance.txt"
          if curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 15 --max-time 150 \
            -D "$output/http/backpan-headers.txt" \
            -o "$output/originals/backpan-releases-by-dist-index.txt.gz" \
            https://backpan.cpantesters.org/backpan-releases-by-dist-index.txt.gz; then
            printf 'BACKPAN_FETCH_END_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$output/provenance.txt"
          else
            fetch_rc=$?
            printf 'BACKPAN_FETCH_CURL_EXIT=%s\n' "$fetch_rc" >> "$output/provenance.txt"
            printf 'AUDIT_STATUS=BLOCKED_BACKPAN_SOURCE_UNAVAILABLE\n' >> "$output/provenance.txt"
            # Retain a hash even for a possibly partial download; never parse it.
            if [ -f "$output/originals/backpan-releases-by-dist-index.txt.gz" ]; then
              (cd "$output" && sha256sum originals/backpan-releases-by-dist-index.txt.gz >> SHA256SUMS)
              printf 'BACKPAN_DOWNLOAD_UNVERIFIED=1\n' >> "$output/provenance.txt"
            fi
            echo "::warning title=Public-history audit incomplete::BackPAN download failed (curl $fetch_rc). The raw CPAN snapshot remains preserved; publication remains blocked."
            exit 0
          fi

          # The independently downloaded gzip is hashed before parsing.
          (cd "$output" && sha256sum originals/backpan-releases-by-dist-index.txt.gz >> SHA256SUMS)
          perl ci/inventory-backpan-jq-lite-index.pl \
            --input "$output/originals/backpan-releases-by-dist-index.txt.gz" \
            > "$output/backpan-observed.tsv"
          # Failure here is a review result, never evidence of publication approval.
          perl ci/compare-backpan-cpan-inventory.pl \
            --backpan-file "$output/backpan-observed.tsv" \
            --inventory "$output/cpan-observed.tsv" \
            > "$output/comparison-review-only.txt"
          printf 'COMPARISON_EXIT=0 (SET_OBSERVATIONS_MATCH_ONLY)\n' >> "$output/provenance.txt"

      - name: Preserve raw inputs and audit observations even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-public-history-observations-${{ github.run_id }}
          path: ${{ runner.temp }}/v3-public-history-observations/
          if-no-files-found: error
          retention-days: 14

      - name: Classify snapshot result (audit always needs human signoff)
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          provenance="$RUNNER_TEMP/v3-public-history-observations/provenance.txt"
          if [ "$CAPTURE_OUTCOME" != success ]; then
            echo '::error title=Public-history observation validation failed::Downloaded source could not be parsed, contained an internal artifact, or yielded unreconciled observations.'
            echo 'AUDIT_STATUS=BLOCKED_VALIDATION_FAILURE' >> "$provenance"
            exit 1
          fi
          if grep -Eq '^AUDIT_STATUS=BLOCKED_(CPAN|BACKPAN)_SOURCE_UNAVAILABLE
 "$provenance"; then
            echo '::warning title=Public-history evidence unavailable::The snapshot job handled an unreachable HTTPS source; this is NOT a successful public-history audit.'
            {
              echo '### Public-history audit: BLOCKED (remote source unavailable)'
              echo 'The collection workflow completed safely, but required public evidence could not be downloaded.'
              echo 'No CPAN/PAUSE chronology, complete ledger, version approval or publication is authorized.'
              echo 'Inspect the retained artifact, provenance and fetch logs.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -Fq 'COMPARISON_EXIT=0 (SET_OBSERVATIONS_MATCH_ONLY)' "$provenance"; then
            echo '::error::Neither a verified observation comparison nor a documented source-unavailable status was produced.'
            exit 1
          fi
          {
            echo '### Public-history audit: BLOCKED (source sets agree only)'
            echo 'This is an observation set comparison, not original PAUSE chronology or release approval.'
          } >> "$GITHUB_STEP_SUMMARY"
