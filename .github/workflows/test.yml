name: Perl tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Perl ${{ matrix.perl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ["5.14", "5.26", "5.38", "5"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Show Perl version
        run: perl -V

      - name: Verify warning gate rejects a successful command with stderr
        shell: bash
        run: |
          set -euo pipefail
          sh ci/fail-on-test-stderr.sh perl -e 'print "no warning\\n"'
          if sh ci/fail-on-test-stderr.sh perl -we 'warn "intentional CI gate test\\n"' \
            > /dev/null 2> "$RUNNER_TEMP/expected-warning.txt"; then
            echo "stderr gate incorrectly accepted a Perl warning" >&2
            exit 1
          fi
          grep -Fq "intentional CI gate test" "$RUNNER_TEMP/expected-warning.txt"

      - name: Run tests (fail on unexpected warnings)
        shell: bash
        run: sh ci/fail-on-test-stderr.sh prove -lr t
