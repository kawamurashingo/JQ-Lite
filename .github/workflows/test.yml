name: Perl tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perl-compat:
    name: Ubuntu / Perl ${{ matrix.perl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ["5.14", "5.26", "5.38", "5"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Show Perl version
        run: perl -V

      - name: Run tests
        run: prove -lr t

  platform-compat:
    name: ${{ matrix.os }} / Perl latest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5"

      - name: Show Perl version
        run: perl -V

      - name: Run portability smoke tests
        run: prove -lv t/portability.t

      - name: Run full test suite
        run: prove -lr t
